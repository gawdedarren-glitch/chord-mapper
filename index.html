<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChordMapper Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
        .mono { font-family: 'Roboto Mono', monospace; }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 pb-20">
    <div class="max-w-md mx-auto space-y-6">
        <header class="border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-blue-500">ChordMapper</h1>
            <p class="text-gray-400 text-xs">Screenshot-to-PDF Sync Engine</p>
        </header>

        <section class="space-y-4">
            <div>
                <label class="text-xs uppercase text-gray-500 font-bold">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Paste Key Here" class="w-full p-3 bg-gray-800 rounded border border-gray-700 text-blue-400">
            </div>

            <div class="relative border-2 border-dashed border-gray-700 rounded-lg p-6 text-center hover:border-blue-500 transition">
                <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                <p id="fileName" class="text-sm text-gray-400">Click to Upload Chord AI Screenshot</p>
            </div>

            <div>
                <label class="text-xs uppercase text-gray-500 font-bold">Accurate Lyrics</label>
                <textarea id="lyricsInput" placeholder="Paste your clean lyrics here..." class="w-full h-48 p-3 bg-gray-800 rounded border border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95">
                GENERATE ULTIMATE PDF
            </button>
        </section>

        <div id="status" class="text-center text-sm font-medium"></div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        // UI Listeners
        document.getElementById('imageInput').addEventListener('change', e => {
            document.getElementById('fileName').innerText = e.target.files[0].name;
        });

        document.getElementById('processBtn').onclick = async () => {
            const key = document.getElementById('apiKey').value;
            const lyrics = document.getElementById('lyricsInput').value;
            const file = document.getElementById('imageInput').files[0];
            const status = document.getElementById('status');

            if(!key || !lyrics || !file) return alert("Please provide Key, Lyrics, and Image.");

            status.innerText = "Analyzing Screenshot...";
            status.className = "text-blue-400 animate-pulse text-center";

            try {
                // 1. Convert Image to Base64
                const base64Img = await toBase64(file);
                const imageData = base64Img.split(',')[1];

                // 2. Call Gemini Vision API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {text: `Look at this chord grid. Map the chords to these lyrics: "${lyrics}". 
                                Return only the ChordPro format where chords are in brackets [Chord] 
                                placed exactly before the correct syllable. Format like Ultimate Guitar.`},
                                {inline_data: {mime_type: file.type, data: imageData}}
                            ]
                        }]
                    })
                });

                const result = await response.json();
                const chordProText = result.candidates[0].content.parts[0].text;
                
                status.innerText = "Creating PDF...";
                createPDF(chordProText);
                status.innerText = "Success! PDF Downloaded.";
                status.className = "text-green-400 text-center";

            } catch (err) {
                console.error(err);
                status.innerText = "Error processing. Check API Key.";
                status.className = "text-red-400 text-center";
            }
        };

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function createPDF(text) {
            const doc = new jsPDF();
            doc.setFont("courier", "bold");
            doc.setFontSize(10);

            // Simple ChordPro to Lead Sheet converter logic
            const lines = text.split('\n');
            let y = 20;

            lines.forEach(line => {
                if(y > 280) { doc.addPage(); y = 20; }
                
                // Separate chords and lyrics for the "UG" look
                let chordsLine = "";
                let lyricsLine = "";
                let i = 0;

                const segments = line.split(/\[(.*?)\]/);
                segments.forEach((seg, index) => {
                    if (index % 2 === 1) { // It's a chord
                        chordsLine = chordsLine.padEnd(lyricsLine.length) + seg;
                    } else { // It's text
                        lyricsLine += seg;
                    }
                });

                if(chordsLine.trim()) {
                    doc.setTextColor(0, 0, 255); // Blue chords
                    doc.text(chordsLine, 20, y);
                    y += 5;
                }
                doc.setTextColor(0, 0, 0); // Black lyrics
                doc.text(lyricsLine, 20, y);
                y += 10;
            });

            doc.save("LeadSheet.pdf");
        }
    </script>
</body>
</html>
